name: Build Windows installer

# Builds the Windows (NSIS) installer on a real Windows runner — including
# the bundled Whisper sidecar, which must be compiled on Windows — and
# attaches GhostMind.exe + latest.yml to an existing GitHub release.
# Trigger manually from the Actions tab (or `gh workflow run`).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the installer to'
        required: true
        default: 'v3.9.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Whisper sidecar (bundled transcription engine)
        shell: pwsh
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/pip install -r sidecar/requirements.txt pyinstaller
          sidecar/.venv/Scripts/pyinstaller --noconfirm --distpath sidecar/bin --workpath build/pyi-work sidecar/ghostmind-whisper.spec
          Get-ChildItem sidecar/bin

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ inputs.tag }} dist/GhostMind.exe dist/latest.yml --clobber
