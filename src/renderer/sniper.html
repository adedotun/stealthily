<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.35);
    /* STEALTH: the OS pointer is drawn by the OS, not inside this
       capture-protected window, and screen-share tools include it.
       'crosshair' would show a suspicious '+', and even a moving arrow
       traces your selection for the audience. So the pointer is hidden
       entirely while sniping — viewers see a still screen. You still
       aim precisely with the in-window guide lines and selection box,
       which only you can see. For zero mouse movement at all, use the
       keyboard selection below (arrows / Alt+arrows / Enter). */
    cursor: none;
    user-select: none;
    overflow: hidden;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  #overlay {
    position: fixed; inset: 0;
  }
  #selection {
    position: absolute;
    border: 2px solid #00ff88;
    box-shadow:
      0 0 0 1px rgba(0,255,136,0.3),
      inset 0 0 30px rgba(0,255,136,0.03);
    display: none;
    pointer-events: none;
  }
  /* Corner handles */
  #selection::before, #selection::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-color: #00ff88;
    border-style: solid;
  }
  #selection::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  #selection::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }
  #dims {
    position: absolute;
    background: rgba(0,0,0,0.85);
    color: #00ff88;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid rgba(0,255,136,0.3);
    pointer-events: none;
    white-space: nowrap;
    display: none;
  }
  #instructions {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 0.5px;
    line-height: 2;
    pointer-events: none;
  }
  #instructions .key {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
  }
  #crosshair-h, #crosshair-v {
    position: fixed;
    background: rgba(0,255,136,0.15);
    pointer-events: none;
  }
  #crosshair-h { left: 0; right: 0; height: 1px; }
  #crosshair-v { top: 0; bottom: 0; width: 1px; }
</style>
</head>
<body>
<div id="overlay">
  <div id="crosshair-h"></div>
  <div id="crosshair-v"></div>
  <div id="instructions">
    <div>GHOSTMIND SNIPER</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;">
      Drag to select &nbsp;·&nbsp; or <span class="key">←→↑↓</span> move box &nbsp;·&nbsp; <span class="key">Alt</span>+arrows resize &nbsp;·&nbsp; <span class="key">Enter</span> capture &nbsp;·&nbsp; <span class="key">ESC</span> cancel
    </div>
  </div>
  <div id="selection"></div>
  <div id="dims"></div>
</div>
<script>
  const overlay     = document.getElementById('overlay');
  const selEl       = document.getElementById('selection');
  const dimsEl      = document.getElementById('dims');
  const instructions = document.getElementById('instructions');
  const crossH      = document.getElementById('crosshair-h');
  const crossV      = document.getElementById('crosshair-v');

  let startX = 0, startY = 0, dragging = false;

  document.addEventListener('mousemove', (e) => {
    crossH.style.top  = e.clientY + 'px';
    crossV.style.left = e.clientX + 'px';

    if (dragging) {
      const x = Math.min(e.clientX, startX);
      const y = Math.min(e.clientY, startY);
      const w = Math.abs(e.clientX - startX);
      const h = Math.abs(e.clientY - startY);

      selEl.style.left   = x + 'px';
      selEl.style.top    = y + 'px';
      selEl.style.width  = w + 'px';
      selEl.style.height = h + 'px';
      selEl.style.display = 'block';

      // Dims label: stick above selection, clamp to screen
      const labelX = Math.min(x, window.innerWidth  - 120);
      const labelY = Math.max(y - 24, 4);
      dimsEl.style.left    = labelX + 'px';
      dimsEl.style.top     = labelY + 'px';
      dimsEl.style.display = 'block';
      dimsEl.textContent   = `${w} × ${h}`;
    }
  });

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    dragging = true;
    instructions.style.display = 'none';
    selEl.style.display = 'block';
  });

  document.addEventListener('mouseup', async (e) => {
    if (!dragging) return;
    dragging = false;

    const x = Math.min(e.clientX, startX);
    const y = Math.min(e.clientY, startY);
    const w = Math.abs(e.clientX - startX);
    const h = Math.abs(e.clientY - startY);

    if (w < 10 || h < 10) {
      window.ghostmind.snipeCancel();
      return;
    }

    // Brief flash to confirm selection
    selEl.style.background = 'rgba(0,255,136,0.08)';
    await new Promise(r => setTimeout(r, 120));

    await window.ghostmind.snipeResult({ x, y, w, h });
  });

  // ── Keyboard selection (v2.3): the mouse never has to move ──────────────
  // A selection box starts centred. Arrow keys move it (Shift = 1px fine
  // steps), Alt+arrows resize it, Enter captures it. Because the pointer
  // is hidden (cursor: none) and this box lives inside the protected
  // overlay, a screen-share audience sees literally nothing happen.
  const kb = { active: false, x: 0, y: 0, w: 0, h: 0 };

  function kbShow() {
    if (!kb.active) {
      kb.w = Math.round(window.innerWidth * 0.6);
      kb.h = Math.round(window.innerHeight * 0.6);
      kb.x = Math.round((window.innerWidth - kb.w) / 2);
      kb.y = Math.round((window.innerHeight - kb.h) / 2);
      kb.active = true;
      instructions.style.display = 'none';
    }
    selEl.style.left   = kb.x + 'px';
    selEl.style.top    = kb.y + 'px';
    selEl.style.width  = kb.w + 'px';
    selEl.style.height = kb.h + 'px';
    selEl.style.display = 'block';
    const labelX = Math.min(kb.x, window.innerWidth - 120);
    const labelY = Math.max(kb.y - 24, 4);
    dimsEl.style.left    = labelX + 'px';
    dimsEl.style.top     = labelY + 'px';
    dimsEl.style.display = 'block';
    dimsEl.textContent   = `${kb.w} × ${kb.h}`;
    crossH.style.top  = (kb.y + kb.h / 2) + 'px';
    crossV.style.left = (kb.x + kb.w / 2) + 'px';
  }

  function kbClamp() {
    kb.w = Math.max(20, Math.min(kb.w, window.innerWidth));
    kb.h = Math.max(20, Math.min(kb.h, window.innerHeight));
    kb.x = Math.max(0, Math.min(kb.x, window.innerWidth - kb.w));
    kb.y = Math.max(0, Math.min(kb.y, window.innerHeight - kb.h));
  }

  document.addEventListener('keydown', async (e) => {
    if (e.key === 'Escape') { window.ghostmind.snipeCancel(); return; }

    if (e.key === 'Enter' && kb.active) {
      selEl.style.background = 'rgba(0,255,136,0.08)';
      await new Promise(r => setTimeout(r, 120));
      await window.ghostmind.snipeResult({ x: kb.x, y: kb.y, w: kb.w, h: kb.h });
      return;
    }

    const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const d = arrows[e.key];
    if (!d) return;
    e.preventDefault();
    kbShow();
    const step = e.shiftKey ? 1 : 10;
    if (e.altKey) { kb.w += d[0] * step; kb.h += d[1] * step; }
    else         { kb.x += d[0] * step; kb.y += d[1] * step; }
    kbClamp();
    kbShow();
  });

  // A mouse drag takes over from keyboard mode
  document.addEventListener('mousedown', () => {
    if (kb.active) { kb.active = false; selEl.style.background = ''; }
  }, true);
</script>
</body>
</html>
